name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_coverage.py
      - run: python3 scripts/validate_package.py
      - run: python3 scripts/package_skills.py --output /tmp/math-founder-stack-dist
